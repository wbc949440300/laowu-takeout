name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sky-take-out/sky-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sky-take-out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - run: mvn test -q

  web:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --openssl-legacy-provider
    defaults:
      run:
        working-directory: sky-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: sky-web/package-lock.json
      - run: npm ci
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -z | grep -z -E '(^|/)(\.env|.*\.db(-.*)?|.*\.log)$' >/dev/null; then
            echo "Sensitive local files are tracked" >&2
            exit 1
          fi
          # Placeholder values such as your-... and replace-with-... are allowed.
          if git grep -n -E 'sk-[A-Za-z0-9]{20,}' -- ':!**/.env.example'; then
            echo "Potential secret detected" >&2
            exit 1
          fi
