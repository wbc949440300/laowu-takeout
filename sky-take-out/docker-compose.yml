# 老吴外卖一键编排：MySQL + Redis + 后端服务
# 注意：首次启动前需初始化数据库——把课程 SQL 脚本放到 ./db-init 目录（该目录会挂载到
# MySQL 的 docker-entrypoint-initdb.d，首次建库时自动执行；docs 下的增量脚本也可放入）
services:
  mysql:
    image: mysql:8.0
    mem_limit: 768m
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    container_name: sky-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: sky_take_out
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:6.2
    mem_limit: 256m
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    container_name: sky-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDISCLI_AUTH ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-123456}

  sky-server:
    build:
      context: .
      dockerfile: sky-server/Dockerfile
    container_name: sky-server
    mem_limit: 1024m
    logging:
      options:
        max-size: "20m"
        max-file: "10"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 覆盖 application-dev.yml 中的连接地址（容器内用服务名访问）
      SKY_DATASOURCE_HOST: mysql
      SKY_DATASOURCE_PORT: 3306
      SKY_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      SKY_REDIS_HOST: redis
      SKY_REDIS_PORT: 6379
      SKY_REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      SKY_JWT_ADMIN_SECRET: ${SKY_JWT_ADMIN_SECRET:-dev-admin-jwt-secret-change-before-production-2026}
      SKY_JWT_USER_SECRET: ${SKY_JWT_USER_SECRET:-dev-user-jwt-secret-change-before-production-2026}
      SKY_INTERNAL_KEY: ${SKY_INTERNAL_KEY:-dev-internal-service-key-change-before-production-2026}
      SKY_INTERNAL_ALLOWED_IPS: ${SKY_INTERNAL_ALLOWED_IPS:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  sky-agent:
    build:
      context: ./sky-agent
    container_name: sky-agent
    mem_limit: 768m
    logging:
      options:
        max-size: "20m"
        max-file: "10"
    depends_on:
      sky-server:
        condition: service_healthy
    environment:
      # DeepSeek 凭证从宿主机环境变量/同级 .env 注入，勿写死在仓库里：
      #   docker compose --env-file sky-agent/.env up
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-v4-flash
      SKY_SERVER_BASE_URL: http://sky-server:8080
      USER_JWT_SECRET: ${SKY_JWT_USER_SECRET:-dev-user-jwt-secret-change-before-production-2026}
      AGENT_ENVIRONMENT: ${SPRING_PROFILES_ACTIVE:-dev}
      # 生产环境通过 AGENT_CORS_ORIGINS 配置实际前端来源，多个来源用逗号分隔。
      CORS_ORIGINS: ${AGENT_CORS_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      AGENT_PORT: 8000
      CHECKPOINT_DB: /data/checkpoints.db
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      # 会话持久化（SQLite checkpointer 单独数据目录，不覆盖代码）
      - agent-data:/data

volumes:
  mysql-data:
  redis-data:
  agent-data:
