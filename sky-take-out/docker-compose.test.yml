services:
  mysql-test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: test-password
      MYSQL_DATABASE: sky_take_out
    ports:
      - "13306:3306"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ptest-password --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis-test:
    image: redis:6.2
    command: redis-server --requirepass test-password
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a test-password ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
